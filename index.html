<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jiraaph is coming soon. Something exciting is on its way.">
    <meta name="theme-color" content="#ffc900">
    <title>Jiraaph | Coming Soon</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #ffc900;
        color: #102b86;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(100%, 177.78svh);
        text-align: center;
      }

      .scene {
        position: relative;
      }

      .artwork {
        display: block;
        width: 100%;
      }

      .giraffe {
        position: absolute;
        left: 9.375%;
        top: 30.556%;
        width: 33.854%;
        transform-origin: 50% 80%;
        animation: run 2.8s ease-in-out infinite;
      }

      @keyframes run {
        0%, 100% {
          transform: translate(0, 0) rotate(-1deg);
        }
        50% {
          transform: translate(2%, -3%) rotate(1deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .giraffe {
          animation: none;
        }
      }

      .message {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

    </style>
  </head>
  <body>
    <main>
      <div class="scene">
        <img class="artwork" src="jiraaph-background.png" alt="">
        <img class="giraffe" src="giraffe.png" alt="">
      </div>
      <div class="message">
        <h1>Jiraaph is coming soon</h1>
        <p>Something exciting is on its way.</p>
      </div>
    </main>
  </body>
</html>
